<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carousel Imagini</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: white;
      color: black;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .carousel-container {
      position: relative;
      width: 80%;
      max-width: 900px;
      aspect-ratio: 16/9;
      overflow: hidden;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      background: white;
    }

    #image-list {
      list-style: none;
      padding: 0;
      margin: 0;
      height: 100%;
      position: relative;
    }

    #image-list li {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      width: 100%;
      height: 100%;
    }

    #image-list li.active {
      display: block;
    }

    #image-list img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 15px;
    }

    #image-list a {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      font-size: 1.2rem;
      border-radius: 5px;
    }

    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      z-index: 2;
      border-radius: 5px;
    }

    #previous-button {
      left: 10px;
    }

    #next-button {
      right: 10px;
    }

    .carousel-button:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }
  </style>
</head>

<body>

<div class="carousel-container">
  <ol id="image-list">
    <li class="active">
      <img src="images5/image1.jpeg" alt="Image 1" />
      <a href="#">Link 1</a>
    </li>
    <li>
      <img src="images5/image2.jpeg" alt="Image 2" />
      <a href="#">Link 2</a>
    </li>
    <li>
      <img src="images5/image3.jpeg" alt="Image 3" />
      <a href="#">Link 3</a>
    </li>
    <li>
      <img src="images5/image4.jpeg" alt="Image 4" />
      <a href="#">Link 4</a>
    </li>
    <li>
      <img src="images5/image5.jpeg" alt="Image 5" />
      <a href="#">Link 5</a>
    </li>
  </ol>

  <button class="carousel-button" id="previous-button">⟨</button>
  <button class="carousel-button" id="next-button">⟩</button>
</div>

<script>
  const items = document.querySelectorAll('#image-list li');
  let currentIndex = 0;
  let intervalId;

  function showSlide(index) {
    items.forEach((item, i) => {
      item.classList.toggle('active', i === index);
    });
    currentIndex = index;
  }

  function nextSlide() {
    showSlide((currentIndex + 1) % items.length);
  }

  function previousSlide() {
    showSlide((currentIndex - 1 + items.length) % items.length);
  }

  document.getElementById('next-button').addEventListener('click', () => {
    nextSlide();
    restartInterval();
  });

  document.getElementById('previous-button').addEventListener('click', () => {
    previousSlide();
    restartInterval();
  });

  function startInterval() {
    intervalId = setInterval(nextSlide, 3000);
  }

  function restartInterval() {
    clearInterval(intervalId);
    startInterval();
  }

  startInterval();
</script>

</body>
</html>
